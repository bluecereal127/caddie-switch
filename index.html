<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caddie·Switch</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- NO Netlify Form lives here, deliberately. Netlify registers forms by
         parsing the built HTML, and every registered submission is metered
         (that bill was real: ~195 submissions in Jul/Aug 2026 = $19, because
         the Shortcut posted one form submission per photo). Capture uploads
         now go through netlify/edge-functions/upload.js, which answers POST /
         itself and writes into the "captures" blob store. Re-adding a
         form element here would silently re-arm the meter. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
